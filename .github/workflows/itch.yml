name: Publish to itch.io

# Runs after CI passes on main, and publishes the dist/ that CI built and checked.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read

concurrency:
  group: itch
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - name: Check itch.io settings
        id: settings
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_USER" ] || [ -z "$ITCH_GAME" ]; then
            echo "::notice title=itch.io publish skipped::Set the BUTLER_API_KEY secret and the ITCH_USER and ITCH_GAME variables to publish (see README, Deploy)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.settings.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Install butler
        if: steps.settings.outputs.ready == 'true'
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
      - name: Push to itch.io
        if: steps.settings.outputs.ready == 'true'
        run: butler push dist "$ITCH_USER/$ITCH_GAME:html5" --userversion "${{ github.event.workflow_run.head_sha }}" --if-changed
